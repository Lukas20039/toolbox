name: YouTube smoke test

# YouTube changes often and frequently blocks datacenter IPs, so real YouTube
# downloads are checked here on a schedule instead of blocking every CI run.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build & start container
        run: |
          docker build -t toolbox:test .
          docker run -d --name toolbox --network host toolbox:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Download from YouTube
        env:
          BASE_URL: http://127.0.0.1:8000
          RUN_YOUTUBE: "1"
        run: pytest -v tests/e2e/test_youtube.py

      - if: failure()
        run: docker logs toolbox
